name: ✨ Feature Request
description: Propose an API, a playback behaviour, or a workflow improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome — especially ones that stay true to the package's promise:
        **lightweight, zero-GC, and robust.** Please sketch the problem before the solution.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checklist
      options:
        - label: I searched existing issues and discussions for this idea.
          required: true
        - label: This is about UniVRMA Motion Player itself, not a general UniVRM/Unity question.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe your use case and what currently gets in the way. Avoid jumping to an API design yet.
      placeholder: |
        I stream VTuber content and switch VRMA clips every 2–3 seconds from a timeline.
        Today I have to call `Play(0)` and then `Stop()` to clear the previous pose, which
        produces a one-frame T-pose pop.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API, component, or behaviour you would like to see. A code sketch is gold.
      placeholder: |
        ```csharp
        // Cross-fade between clips without touching global animation state
        player.CrossFade(index: 3, duration: 0.15f);
        ```
      render: markdown
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds exist today? Why are they insufficient?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Runtime API (IVrmaPlayer / VrmaPlayer)
        - Hips stabilisation (StableHipsPoseProvider)
        - Rest pose / rig utilities
        - Object pool & root motion
        - Events & integrations (Timeline, Input System, Cinemachine)
        - Editor tooling
        - Documentation & samples
        - Packaging / CI
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: How much does this matter to you?
      options:
        - Nice to have
        - Would unblock a real project
        - Blocking production use
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a PR for this.
          required: false
        - label: I can help test a prototype on my models.
          required: false
        - label: I can provide sample assets (VRM / VRMA) for testing.
          required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, references to other engines/libraries, constraints (Quest 2, IL2CPP, ≥60 FPS…).
    validations:
      required: false
